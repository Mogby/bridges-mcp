instance_id: main
http:
  port: 8765
clients:
  codex:
    token_env: CODEX_MCP_TOKEN
    socket_path: /var/lib/codex/app-server-control/app-server-control.sock
sessions:
  personal:
    client: codex
    cwd: /srv/assistant
telegram:
  bots:
    main:
      token_env: TELEGRAM_BOT_TOKEN
      admin: false
  connections:
    personal:
      bot: main
      chat_id: "123456789"
      session_id: personal
      allow_admin: false
state_dir: /var/lib/bridges-mcp
download_dir: /srv/assistant/downloads
