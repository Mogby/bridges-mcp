instance_id: main
http:
  port: 8765
clients:
  assistant:
    token_env: ASSISTANT_MCP_TOKEN
    socket_path: /run/assistant/codex.sock
    # Optional application-owned admin control endpoint; see docs/admin.md.
    # control_socket_path: /run/assistant/bridges-control.sock
telegram:
  bots:
    main:
      token_env: TELEGRAM_BOT_TOKEN
      admin: false
  connections:
    personal:
      bot: main
      chat_id: "123456789"
      allow_admin: false
state_dir: /var/lib/bridges-mcp
download_dir: /srv/assistant/downloads
