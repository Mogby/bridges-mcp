[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bridges-mcp"
version = "0.3.0"
description = "Shared Telegram MCP server with persistent per-connection session focus"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.30,<2", "httpx>=0.28,<1", "PyYAML>=6,<7", "Pillow>=11,<13",
  "pydantic>=2.11,<3", "jsonschema>=4.20,<5", "uvicorn>=0.31,<1", "starlette>=0.46,<2", "websockets>=15,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
bridges = "bridges.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
